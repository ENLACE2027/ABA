<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación Cena - ABA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <div class="max-w-md w-full mx-auto bg-white min-h-screen shadow-md flex flex-col justify-between">
        
        <header class="bg-rose-900 text-white p-6 text-center shadow-lg">
            <h1 class="text-2xl font-bold tracking-wide">ABA</h1>
            <p class="text-rose-200 text-sm mt-1">Confirmación de Asistencia a la Cena</p>
        </header>

        <div id="pantalla-login" class="p-6 flex-grow flex flex-col justify-center items-center">
            <div class="w-full space-y-4">
                <div class="text-center mb-6">
                    <p class="text-gray-600 font-medium">Introduce tu DNI para confirmar tu asistencia a la cena</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Tu DNI</label>
                    <input type="text" id="login-dni" placeholder="Ej: 12345678Z" class="w-full p-4 border-2 border-gray-300 rounded-xl text-lg font-semibold uppercase focus:border-rose-800 focus:outline-none">
                </div>
                <button onclick="verificarAcceso()" class="w-full bg-rose-900 text-white font-bold p-4 rounded-xl shadow-md text-lg hover:bg-rose-800 transition-colors">
                    Acceder al Formulario
                </button>
            </div>
        </div>

        <div id="pantalla-formulario" class="p-6 flex-grow hidden space-y-6">
            <div class="bg-rose-50 p-4 rounded-xl border border-rose-100">
                <span class="text-xs uppercase font-bold text-rose-800 tracking-wider">Titular Autorizado</span>
                <h2 id="nombre-titular" class="text-xl font-bold text-gray-800">Cargando...</h2>
                <p class="text-xs text-gray-600 mt-2 font-medium leading-relaxed">
                    Indica tu elección de segundo plato, alergias y añade los datos de tus acompañantes.
                </p>
            </div>

            <form id="form-cena" onsubmit="guardarDatosCena(event)" class="space-y-6">
                
                <!-- Datos del Titular para la cena -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs uppercase font-extrabold tracking-wider text-rose-900">Tus datos para la cena</span>
                        <span class="bg-green-100 text-green-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">Asistencia Confirmada</span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Segundo Plato</label>
                        <select id="plato-titular" class="w-full p-3 text-sm border rounded-lg bg-white focus:outline-none font-medium text-gray-800">
                            <option value="" disabled selected>Selecciona segundo plato</option>
                            <option value="Carne">Carne</option>
                            <option value="Pescado">Pescado</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Tus alergias o intolerancias</label>
                        <input type="text" id="alergias-titular" placeholder="Ej: Celíaco, alérgico al marisco..." class="w-full p-3 text-sm border rounded-lg focus:outline-none bg-white">
                    </div>
                </div>

                <!-- Lista de acompañantes para la cena -->
                <div id="lista-acompanantes-cena" class="space-y-4"></div>

                <div class="flex justify-center pt-2">
                    <button type="button" onclick="crearTarjetaAcompananteCenaVacia()" class="w-full border-2 border-dashed border-rose-400 text-rose-900 bg-rose-50/60 font-bold p-3 rounded-xl flex items-center justify-center gap-2 hover:bg-rose-100 transition-colors text-sm shadow-sm">
                        <span>➕ Añadir Acompañante a la Cena</span>
                    </button>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="check-lopd" type="checkbox" class="w-5 h-5 text-rose-900 border-gray-300 rounded focus:ring-rose-800 cursor-pointer">
                        </div>
                        <div class="ml-3 text-xs">
                            <label for="check-lopd" class="font-medium text-gray-700 cursor-pointer select-none">
                                Acepto el tratamiento de los datos facilitados exclusivamente para la organización del evento de ABA de conformidad con la LOPDGDD y el RGPD.
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white font-bold p-4 rounded-lg shadow-lg text-lg hover:bg-green-700 transition-colors">
                    Guardar y Confirmar Cena
                </button>
            </form>
        </div>

        <footer class="p-4 bg-gray-50 text-center border-t border-gray-200">
            <p class="text-xs text-gray-400 font-medium">© 2026 Organización ABA</p>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = "https://vvgxdneixtrtainoaxzn.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2Z3hkbmVpeHRydGFpbm9heHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTQ3NzYsImV4cCI6MjA5NjUzMDc3Nn0.uVpF67WDU4jBhfYcBao-YUFVDt0bdIXPgbWv2AqnYSM";
        
        let _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let usuarioDni = "";
        let titularNombreCompleto = "";
        let contadorIndicesDinamicos = 0;

        function validarDocumentoIdentidad(documento) {
            const regexEspañol = /^[XYZ\d]\d{7}[A-Z]$/i;
            if (regexEspañol.test(documento)) {
                let stringDni = documento.toUpperCase();
                stringDni = stringDni
                    .replace(/^X/, '0')
                    .replace(/^Y/, '1')
                    .replace(/^Z/, '2');

                const numero = parseInt(stringDni.substr(0, 8), 10);
                const letraIntroducida = stringDni.substr(8, 1);
                const letrasValidas = "TRWAGMYFPDXBNJZSQVHLCKE";
                const letraCorrecta = letrasValidas.charAt(numero % 23);

                return letraIntroducida === letraCorrecta;
            }

            const regexExtranjero = /^[A-Z0-9]{6,20}$/i;
            return regexExtranjero.test(documento);
        }

        async function verificarAcceso() {
            const inputDni = document.getElementById('login-dni').value.trim().toUpperCase();
            
            if(!inputDni) {
                Swal.fire('Atención', 'Por favor, escribe tu DNI.', 'warning');
                return;
            }

            if (!validarDocumentoIdentidad(inputDni)) {
                Swal.fire({
                    title: 'DNI Incorrecto',
                    text: 'El formato del DNI introducido no es válido.',
                    icon: 'error',
                    confirmButtonColor: '#ef4444'
                });
                return; 
            }

            Swal.fire({ title: 'Buscando tu registro...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            try {
                const { data: titular, error } = await _supabase
                    .from('titulares')
                    .select('*')
                    .eq('DNI', inputDni)
                    .maybeSingle();

                if (error || !titular) {
                    Swal.fire('No encontrado', 'El DNI introducido es correcto, pero no consta en la lista de autorizados.', 'error');
                    return;
                }

                usuarioDni = inputDni;
                titularNombreCompleto = titular["NOMBRE COMPLETO"];
                document.getElementById('nombre-titular').innerText = titularNombreCompleto;
                
                await cargarDatosCenaExistentes();

                document.getElementById('pantalla-login').classList.add('hidden');
                document.getElementById('pantalla-formulario').classList.remove('hidden');
                Swal.close();

            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Hubo un problema al conectar con el servidor.', 'error');
            }
        }

        async function cargarDatosCenaExistentes() {
            const container = document.getElementById('lista-acompanantes-cena');
            container.innerHTML = "";
            contadorIndicesDinamicos = 0;

            const { data: registros } = await _supabase
                .from('cena')
                .select('*')
                .eq('titular_dni', usuarioDni)
